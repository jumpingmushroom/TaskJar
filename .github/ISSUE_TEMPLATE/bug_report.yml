name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or release, e.g. 0.2.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run TaskJar?
      options:
        - Unraid template
        - Docker Compose
        - Plain Docker
        - From source
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone 15, Safari; Windows desktop, Firefox
  - type: textarea
    id: logs
    attributes:
      label: Container logs
      description: Anything relevant from `docker logs taskjar`.
      render: text
