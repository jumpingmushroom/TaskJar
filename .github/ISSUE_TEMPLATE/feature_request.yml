name: Feature request
description: Suggest an idea for TaskJar
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation or problem, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: markdown
    attributes:
      value: Check the roadmap in the README first; forcing, recurring tasks, people, seasonal tasks and a wall-panel card are already planned.
