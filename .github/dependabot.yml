version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: chore(deps)
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Types must match the Node runtime in the Dockerfile; bump both together on purpose.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    commit-message:
      prefix: ci(deps)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the current LTS line; move to the next major deliberately.
      - dependency-name: node
        update-types: ['version-update:semver-major']
    labels: [dependencies]
    commit-message:
      prefix: build(deps)
