name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t taskjar:latest .
      - name: Start with Compose
        env:
          ORIGIN: http://localhost:3000
        run: |
          docker compose up -d --no-build
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q taskjar)")" = healthy ] && break
            sleep 2
          done
          docker compose ps
          curl -fsS http://localhost:3000/healthz
      - name: Smoke test the running container
        run: |
          set -e
          post() { curl -s -o /dev/null -w '%{http_code}' -H 'Accept: text/html' -H 'Origin: http://localhost:3000' -X POST "http://localhost:3000$1" -d "$2"; }
          # Plain browser form posts (Accept: text/html). Valid task: redirect after save.
          [ "$(post /jar/new 'title=Water the plants&minutes=5')" = 303 ]
          # The 30-minute rule on the server.
          [ "$(post /jar/new 'title=Too big&minutes=45')" = 400 ]
          # Wrong origin is rejected, so ORIGIN matters.
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: http://evil.example' -X POST http://localhost:3000/jar/new -d 'title=x&minutes=5')" = 403 ]
          curl -fsS http://localhost:3000/jar | grep -q 'Water the plants'
      - name: Data survives a restart
        env:
          ORIGIN: http://localhost:3000
        run: |
          docker compose down
          docker compose up -d --no-build
          sleep 5
          curl -fsS http://localhost:3000/jar | grep -q 'Water the plants'
      - name: Unraid-style run (root-owned appdata, PUID 99 / PGID 100)
        env:
          ORIGIN: http://localhost:3000
        run: |
          set -e
          docker compose down
          sudo mkdir -p /tmp/appdata/taskjar && sudo chown root:root /tmp/appdata/taskjar
          docker run -d --name unraid -p 3001:3000 \
            -e ORIGIN=http://localhost:3001 -e PUID=99 -e PGID=100 \
            -v /tmp/appdata/taskjar:/data taskjar:latest
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' unraid)" = healthy ] && break
            sleep 2
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' unraid)" = healthy ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: text/html' -H 'Origin: http://localhost:3001' -X POST http://localhost:3001/jar/new -d 'title=Unraid task&minutes=10')" = 303 ]
          # The app process runs as 99:100 and owns its data.
          [ "$(stat -c '%u:%g' /tmp/appdata/taskjar/taskjar.db)" = 99:100 ]
          [ "$(docker top unraid -o pid,uid,gid,cmd | awk '/node build/ {print $2":"$3}')" = 99:100 ]
      - name: Unraid template ships in the image and is valid XML
        run: |
          docker run --rm --entrypoint cat taskjar:latest /app/unraid/taskjar.xml > taskjar.xml
          python3 -c "import sys, xml.etree.ElementTree as ET; r = ET.parse('taskjar.xml').getroot(); assert r.findtext('Repository') == 'ghcr.io/jumpingmushroom/taskjar:latest'"
          docker run --rm --entrypoint cat taskjar:latest /app/unraid/icon.png | file - | grep -q PNG
      - name: Logs
        if: always()
        env:
          ORIGIN: http://localhost:3000
        run: |
          docker compose logs
          docker logs unraid || true

  publish:
    # Only images that passed both test jobs, only from main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/jumpingmushroom/taskjar
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
